name: Daily Ranker Story

on:
  schedule:
    # 09:37 KST(00:37 UTC)와 12:37 KST(03:37 UTC)에 두 번 시도한다. GitHub 예약 실행은 UTC 기준이며 지연될 수 있다.
    - cron: '37 0 * * *'
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      day_kst:
        description: '경기 날짜 (KST, YYYY-MM-DD). 비우면 전날.'
        required: false
        type: string
      mode:
        description: '발행 모드. all은 AS 지원 큐인 미발행 Duo/Squad를 순회합니다. Solo는 unsupported로 건너뜁니다.'
        required: false
        type: choice
        options: [all, solo, duo, squad]
        default: all

permissions:
  contents: read

concurrency:
  group: daily-ranker-story
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish verified yesterday winners by mode
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAY_KST: ${{ inputs.day_kst }}
          DAILY_MODE: ${{ inputs.mode }}
          # 09:37 KST 첫 시도의 PUBG 429는 12:37 KST 재시도가 이어받으므로 경고로 넘긴다. 마지막 시도와 수동 실행은 실패로 센다.
          DAILY_STORY_FINAL_ATTEMPT: ${{ github.event.schedule == '37 0 * * *' && 'false' || 'true' }}
        run: |
          mode_arg=()
          if [ -n "$DAILY_MODE" ] && [ "$DAILY_MODE" != "all" ]; then
            mode_arg=("--mode=$DAILY_MODE")
          fi
          if [ -n "$DAY_KST" ]; then
            npx tsx scripts/publish_daily_ranker_story.ts --apply "--day=$DAY_KST" "${mode_arg[@]}"
          else
            npx tsx scripts/publish_daily_ranker_story.ts --apply "${mode_arg[@]}"
          fi
