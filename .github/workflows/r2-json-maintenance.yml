# Temporary diagnostic branch definition. Never merge this replacement into main.
name: R2 Retention Read-only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-retention-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/codex/r2-retention-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read object metadata and database references; encrypt private evidence
        env:
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          RETENTION_VALIDATION_ONLY: 'true'
        run: |
          umask 077
          npx tsx scripts/audit_r2_retention.ts
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const report = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'r2-retention-summary.json'), 'utf8');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + report + '\n```\n');
          JS
      - name: Preserve aggregate report and authenticated ciphertext only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-retention-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r2-retention-summary.json
            ${{ runner.temp }}/r2-retention-private.enc
            ${{ runner.temp }}/r2-retention-wrapped-key.enc
          if-no-files-found: error
          retention-days: 7
