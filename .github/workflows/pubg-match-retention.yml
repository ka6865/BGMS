name: PUBG Match Retention
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 수동 실행에서 처리할 최대 경기 수"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "10"
          - "20"
          - "50"
          - "300"
permissions:
  contents: read
concurrency:
  group: pubg-match-retention
  cancel-in-progress: false
jobs:
  collect:
    # Enable after applying and verifying the discovery migration.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PUBG_MATCH_RETENTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/ingest_discovered_matches.ts --apply --limit "${{ github.event_name == 'workflow_dispatch' && inputs.limit || '300' }}"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
