name: PUBG Match Retention
on:
  schedule:
    # GitHub 예약 실행은 지연될 수 있으므로 20분 간격으로 실행 기회를 둔다.
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/pubg-match-retention.yml
      - scripts/ingest_discovered_matches.ts
      - lib/pubg/discoveryWorker.ts
      - lib/pubg/playerMatches*.ts
      - lib/pubg/matchDiscovery*.ts
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 수동 실행에서 처리할 최대 수집 작업 수"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "10"
          - "20"
          - "50"
          - "300"
          - "500"
          - "1000"
permissions:
  contents: read
concurrency:
  group: pubg-match-retention
  cancel-in-progress: false
jobs:
  collect:
    # Enable after applying and verifying the discovery migration.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PUBG_MATCH_RETENTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/ingest_discovered_matches.ts --apply --limit "${{ github.event_name == 'workflow_dispatch' && inputs.limit || '1000' }}"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
