name: R2 Legacy Copy Verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read current evidence or compact one proven pair into recovery aliases'
        type: choice
        options: [verify, apply]
        default: verify
      pair:
        description: 'One private target pair index for apply (1–20)'
        type: number
        default: 1
      plan_hash:
        description: 'Exact plan hash from the preceding verify run; required for apply'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: r2-json-maintenance
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify current bodies, references, recovery and replay
        env:
          OP_MODE: ${{ inputs.mode }}
          OP_PAIR: ${{ inputs.pair }}
          OP_PLAN_HASH: ${{ inputs.plan_hash }}
          PRIVATE_TARGETS: ${{ secrets.R2_LEGACY_COPY_TARGETS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_RECOVERY_ARCHIVE_KEY: ${{ secrets.R2_RECOVERY_ARCHIVE_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          umask 077
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          if (!['verify', 'apply'].includes(process.env.OP_MODE)) throw new Error('Invalid mode');
          const pair = Number(process.env.OP_PAIR);
          if (!Number.isInteger(pair) || pair < 1 || pair > 20) throw new Error('Invalid pair');
          const targets = JSON.parse(process.env.PRIVATE_TARGETS || '{}');
          if (!Array.isArray(targets.pairs) || !targets.pairs.length || targets.pairs.length > 20) throw new Error('Private bounded targets are required');
          if (process.env.OP_MODE === 'apply') {
            if (!targets.pairs[pair - 1]) throw new Error('Selected pair is absent');
            targets.pairs = [targets.pairs[pair - 1]];
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'copy-targets.json'), JSON.stringify(targets), { mode: 0o600 });
          JS
          args=(--targets "$RUNNER_TEMP/copy-targets.json" --output "$RUNNER_TEMP/copy-private.json")
          if [ "$OP_MODE" = 'apply' ]; then args+=(--apply --plan-hash "$OP_PLAN_HASH"); fi
          npx tsx scripts/verify_legacy_match_copies.ts "${args[@]}" > "$RUNNER_TEMP/copy-summary.json"
          cat "$RUNNER_TEMP/copy-summary.json"
          cat "$RUNNER_TEMP/copy-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt private proof
        if: ${{ !cancelled() }}
        env:
          R2_RECOVERY_ARCHIVE_KEY: ${{ secrets.R2_RECOVERY_ARCHIVE_KEY }}
        run: |
          if [ -f "$RUNNER_TEMP/copy-private.json" ]; then
            npx tsx scripts/r2_recovery_archive.ts seal "$RUNNER_TEMP/copy-private.json" "$RUNNER_TEMP/copy-private.enc"
          fi
      - name: Preserve aggregate measurements and encrypted proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-legacy-copy-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/copy-summary.json
            ${{ runner.temp }}/copy-private.enc
            ${{ runner.temp }}/copy-private.json.journal.enc
          retention-days: 7
          if-no-files-found: ignore
