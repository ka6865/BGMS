name: LoL Augments Sync
on:
  workflow_dispatch:
    inputs:
      patch:
        description: '클라이언트 패치 (예: 16.21, 비우면 최신)'
        type: string
        default: ''
      dry_run:
        description: '다운로드·추출·검증만 실행'
        type: boolean
        default: true
      force:
        description: '게시 대기 중인 패치도 다시 수집'
        type: boolean
        default: false
      icons_only:
        description: '게시된 패치의 아이콘만 Storage에 채움 (patch 필수)'
        type: boolean
        default: false
  schedule:
    - cron: '25 4 * * *'
permissions:
  contents: read
concurrency:
  group: lol-augments-sync
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.LOL_AUGMENT_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect Augments
        env:
          INGEST_PATCH: ${{ inputs.patch }}
          INGEST_DRY_RUN: ${{ inputs.dry_run }}
          INGEST_FORCE: ${{ inputs.force }}
          INGEST_ICONS_ONLY: ${{ inputs.icons_only }}
          LOL_AUGMENT_INGEST_ENABLED: ${{ vars.LOL_AUGMENT_INGEST_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          args=()
          if [[ -n "$INGEST_PATCH" ]]; then args+=(--patch "$INGEST_PATCH"); fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$INGEST_DRY_RUN" != 'false' ]]; then args+=(--dry-run); fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$INGEST_FORCE" == 'true' ]]; then args+=(--force); fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$INGEST_ICONS_ONLY" == 'true' ]]; then args+=(--icons-only); fi
          npx tsx scripts/lol_augments_ingest.ts "${args[@]}" | tee "$RUNNER_TEMP/augments-ingest.log"
      # 새 패치 증강 도감은 관리자가 승인해야 공개되고, 그 전에는 증바람 조합·통계도 새 패치로 공개되지 않는다.
      # 공개 전까지 매일 한 번 알린다.
      - name: Notify Pending Review
        if: ${{ success() && github.event_name == 'schedule' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP_URL: ${{ vars.APP_URL }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/augments-ingest.log"
          if [ -z "$DISCORD_WEBHOOK_URL" ] || [ ! -f "$log" ] || grep -q '"skipped": "already_published"' "$log"; then exit 0; fi
          patch=$(grep -oE '"patch": "[0-9]+\.[0-9]+"' "$log" | head -1 | cut -d'"' -f4)
          if [ -z "$patch" ]; then exit 0; fi
          MESSAGE=$(printf '🆕 **LoL 증강 도감 %s 승인 대기**\n관리자 화면에서 검토·공개해야 증바람 조합·챔피언 통계·순위가 새 패치로 공개됩니다.\n공개 전까지 매일 알립니다.\n\n검토 화면: %s/admin/lol/augments' "$patch" "${APP_URL:-https://bgms.kr}")
          jq -n --arg content "$MESSAGE" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl --connect-timeout 10 --max-time 30 -fsS -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" --data @-
