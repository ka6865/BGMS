name: BGMS Community Agent

on:
  schedule:
    # GitHub Actions 예약 실행은 늦게 시작될 수 있어 정확한 발행 시각이 아니다.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bgms-community-agent
  cancel-in-progress: false

jobs:
  community:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      # 설정이 빠지면 YouTube 원시 metadata 30일 삭제를 포함한 보존 정리도 멈춘다.
      # 예전에는 이 경우 성공(exit 0)으로 끝나 정리 중단을 알 수 없었으므로
      # 이제는 실패로 끝내 failure-notify 가 운영 알림을 보내게 한다.
      # 값 자체는 출력하지 않고 어떤 항목이 비었는지만 남긴다.
      - name: Check community worker configuration
        env:
          APP_URL: ${{ vars.APP_URL }}
          COMMUNITY_AGENT_WORKER_SECRET: ${{ secrets.COMMUNITY_AGENT_WORKER_SECRET }}
        run: |
          missing=""
          if [ -z "$APP_URL" ]; then missing="${missing} vars.APP_URL"; fi
          if [ -z "$COMMUNITY_AGENT_WORKER_SECRET" ]; then missing="${missing} secrets.COMMUNITY_AGENT_WORKER_SECRET"; fi
          if [ -n "$missing" ]; then
            echo "::error title=커뮤니티 비서 설정 없음::다음 설정이 비어 있어 수집과 보존 정리(YouTube 30일 삭제 포함)를 실행할 수 없습니다:${missing}"
            exit 1
          fi
          echo "Community worker configuration is present."
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run community worker
        if: ${{ vars.COMMUNITY_AGENT_SCHEDULE_ENABLED == 'true' }}
        run: npx tsx scripts/run_community_agent.ts
        env:
          COMMUNITY_AGENT_APP_URL: ${{ vars.APP_URL }}
          COMMUNITY_AGENT_WORKER_SECRET: ${{ secrets.COMMUNITY_AGENT_WORKER_SECRET }}
      - name: Run community retention cleanup
        if: ${{ vars.COMMUNITY_AGENT_SCHEDULE_ENABLED != 'true' }}
        run: npx tsx scripts/run_community_agent.ts --cleanup-only
        env:
          COMMUNITY_AGENT_APP_URL: ${{ vars.APP_URL }}
          COMMUNITY_AGENT_WORKER_SECRET: ${{ secrets.COMMUNITY_AGENT_WORKER_SECRET }}

      # Actions 가 꺼져 있거나 앱이 응답하지 않으면 예약된 보존 정리 요청이 실행되지 않는다.
      # 그때는 cleanup-only 명령을 수동으로 실행한다.

  # daily-tasks.yml 의 failure-notify 와 같은 방식으로 실패를 운영 Discord 에 알린다.
  # 예약·수동 실행 모두 community 잡이 실패하거나 시간 초과되면 실행된다.
  # main 이외 ref 에서는 community 잡이 건너뛰어지므로 알림도 실행되지 않는다.
  # 웹훅 secret 은 이 잡에만 전달하고 worker 단계에는 넘기지 않는다.
  failure-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [community]
    if: ${{ failure() }}
    steps:
      - name: Notify Discord On Failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMUNITY_RESULT: ${{ needs.community.result }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is missing; skipping failure notification."
            exit 0
          fi

          status_label() {
            case "$1" in
              success) echo "✅ 정상" ;;
              failure|timed_out) echo "❌ 실패" ;;
              cancelled) echo "⏹ 취소" ;;
              skipped) echo "⏭ 조건에 따라 실행하지 않음" ;;
              *) echo "❔ ${1:-확인 불가}" ;;
            esac
          }

          case "$TRIGGER" in
            schedule) trigger_label="예약 실행" ;;
            workflow_dispatch) trigger_label="수동 실행" ;;
            *) trigger_label="확인 불가" ;;
          esac

          MESSAGE=$(cat <<EOF
          🚨 **BGMS 커뮤니티 비서 작업 실패 알림**
          실행 방식: ${trigger_label}

          **작업별 상태**
          - 커뮤니티 수집·보존 정리: $(status_label "$COMMUNITY_RESULT")

          **운영자가 지금 할 일**
          1. 아래 실행 링크에서 실패 단계의 로그를 확인합니다.
          2. 설정 확인 단계가 실패했다면 저장소의 vars.APP_URL 과 secrets.COMMUNITY_AGENT_WORKER_SECRET 을 확인합니다.
          3. 보존 정리(YouTube 원시 metadata 30일 삭제 포함)가 실행되지 않았을 수 있습니다. 원인을 고친 뒤 재실행하거나 cleanup-only 를 수동 실행합니다.

          실행 로그: ${RUN_URL}
          EOF
          )
          # jq 로 JSON 을 만들어 개행·특수문자 이스케이프를 보장하고 멘션은 끈다.
          jq -n --arg content "$MESSAGE" '{content: (if ($content | length) > 1900 then ($content[0:1899] + "…") else $content end), allowed_mentions: {parse: []}}' \
            | curl --connect-timeout 10 --max-time 30 -fsS -X POST "$DISCORD_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                --data @-
