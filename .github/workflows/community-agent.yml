name: BGMS Community Agent

on:
  schedule:
    # GitHub Actions 예약 실행은 늦게 시작될 수 있어 정확한 발행 시각이 아니다.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bgms-community-agent
  cancel-in-progress: false

jobs:
  community:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - id: config
        name: Check community worker configuration
        env:
          APP_URL: ${{ vars.APP_URL }}
          COMMUNITY_AGENT_WORKER_SECRET: ${{ secrets.COMMUNITY_AGENT_WORKER_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$COMMUNITY_AGENT_WORKER_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Community worker configuration is missing; skipping."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: npm ci --ignore-scripts
      - name: Run community worker
        if: ${{ steps.config.outputs.configured == 'true' && vars.COMMUNITY_AGENT_SCHEDULE_ENABLED == 'true' }}
        run: npx tsx scripts/run_community_agent.ts
        env:
          COMMUNITY_AGENT_APP_URL: ${{ vars.APP_URL }}
          COMMUNITY_AGENT_WORKER_SECRET: ${{ secrets.COMMUNITY_AGENT_WORKER_SECRET }}
      - name: Run community retention cleanup
        if: ${{ steps.config.outputs.configured == 'true' && vars.COMMUNITY_AGENT_SCHEDULE_ENABLED != 'true' }}
        run: npx tsx scripts/run_community_agent.ts --cleanup-only
        env:
          COMMUNITY_AGENT_APP_URL: ${{ vars.APP_URL }}
          COMMUNITY_AGENT_WORKER_SECRET: ${{ secrets.COMMUNITY_AGENT_WORKER_SECRET }}

      # Actions 가 꺼져 있거나 앱이 응답하지 않으면 예약된 보존 정리 요청이 실행되지 않는다.
      # 그때는 cleanup-only 명령을 수동으로 실행한다.
