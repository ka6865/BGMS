name: Daily BGMS Maintenance

on:
  schedule:
    # 매일 한국 시간 새벽 3시 (UTC 18:00) 실행
    - cron: '0 18 * * *'
  workflow_dispatch: # 수동 실행 버튼 추가

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: daily-bgms-maintenance
  cancel-in-progress: false

jobs:
  board-image-cleanup:
    # migration·Preview Storage QA·수동 dry-run 완료 전에는 운영 객체 삭제를 시작하지 않는다.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: board-image-cleanup
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Board Image Cleanup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/cleanup_board_images.ts

  board-write-quota-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Board Write Quota Cleanup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/cleanup_board_write_rate_limits.ts

  maintenance:
    needs: board-write-quota-cleanup
    if: ${{ always() && !cancelled() }}
    outputs:
      database_health: ${{ steps.database_health.outcome }}
      pubg_rate_limited: ${{ steps.sync_user_matches.outputs.rate_limited }}
      candidate_count: ${{ steps.sync_user_matches.outputs.candidate_count }}
      synced_identities: ${{ steps.sync_user_matches.outputs.synced_identities }}
      new_matches: ${{ steps.sync_user_matches.outputs.new_matches }}
      lock_collisions: ${{ steps.sync_user_matches.outputs.lock_collisions }}
      stopped_reason: ${{ steps.sync_user_matches.outputs.stopped_reason }}
      rate_limit_tracking_errors: ${{ steps.linked_sync_summary.outputs.rate_limit_tracking_errors }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Check Database Health Before Maintenance
        id: database_health
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/check_database_maintenance_health.ts

      # 이하 데이터 작업 step 은 install 이 성공한 경우 앞 step 실패와 무관하게 실행한다.
      # 기존에는 cleanup 한 건이 실패하면 뒤 9개 step 이 모두 skip 되어
      # 정리·스크래핑·패치노트 동기화가 며칠간 멈췄다.
      # 순서는 그대로 유지하므로 동일 테이블 동시 접근 위험은 발생하지 않는다.
      # continue-on-error 는 지정하지 않아 실패는 여전히 workflow 실패로 남는다.

      # 알림 secret 이 비어 있으면 실패가 조용히 묻힌다.
      # 2026-08-01 일일 작업이 실패했을 때 DISCORD_WEBHOOK_URL 이 등록되지 않아
      # failure-notify 잡이 "skipping" 으로 성공 처리되고 알림이 가지 않았다.
      # 잡 자체는 success 였으므로 알림 경로가 죽은 것을 감지할 수 없었다.
      #
      # 정리 작업을 막지 않도록 continue-on-error 로 두고 경고만 남긴다.
      - name: Check Notification Secrets
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning title=알림 경로 없음::DISCORD_WEBHOOK_URL 이 등록되지 않아 실패 알림이 발송되지 않습니다. 저장소 secret 을 확인하세요."
            exit 1
          fi
          echo "실패 알림 경로가 설정되어 있습니다."

      # Supabase 무료 플랜에는 자동 백업이 없다. 이 step 이 유일한 복구 수단이므로
      # 정리·삭제 작업보다 반드시 먼저 실행한다. 순서를 바꾸면 삭제 후 상태만
      # 백업되어 복구 가치가 사라진다.
      #
      # 대상은 재생성할 수 없는 사용자 데이터뿐이다(마커 제보, 회원, 게시글).
      # 분석 캐시는 PUBG API 로 다시 만들 수 있어 제외한다.
      - name: Backup Core Tables
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: npx tsx scripts/backup_core_tables.ts

      - name: Check Storage Before Maintenance
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: npx tsx scripts/monitor_storage.ts --label "BEFORE"

      - name: Run Storage Cleanup
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLEANUP_TARGET_VERSION: ${{ secrets.CLEANUP_TARGET_VERSION }}
          CLEANUP_RETENTION_DAYS: ${{ secrets.CLEANUP_RETENTION_DAYS || 5 }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: npx tsx scripts/cleanup_telemetry.ts

      - name: Run AI Cache Cleanup
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/cleanup_ai_cache.ts

      - name: Run Analytics Events Cleanup
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/cleanup_analytics_events.ts

      # match_stats_raw 는 매치당 참가자 전원을 저장하던 이력 때문에 8일치가 180MB 까지 자랐다.
      # 저장 범위 축소(2026-08-01 배포) 이후 신규 유입은 줄었지만, 분석 표본도 승자도 아닌 행은
      # 계속 발생하므로 일일 정리로 편성한다. RPC 가 배치 삭제를 수행하고 멱등하다.
      # 물리 파일 축소가 필요한 경우에만 유지보수 창에서 VACUUM (FULL) 을 수동 실행한다.
      - name: Run Match Stats Raw Compaction
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/cleanup_match_stats_raw.ts --apply

      - name: Audit PUBG Analysis Data Quality
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/audit_processed_telemetry_identity.ts --recent-days 2 --max-rows 1000 --target-limit 50

      - name: Run Smart Scraper
        id: smart_scraper
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          PUBG_SCRAPER_INTERNAL_TOKEN: ${{ secrets.PUBG_SCRAPER_INTERNAL_TOKEN }}
          ADMIN_REVALIDATE_TOKEN: ${{ secrets.ADMIN_REVALIDATE_TOKEN }}
          ELITE_PLAYER_LIMIT: 5 # 인원 절반 축소
          ELITE_MATCH_LIMIT: 3  # 매치 수 축소
          ENABLE_SAMPLING: false # 샘플링 비활성화로 부하 최소화
        run: npx tsx scripts/scrape_elite.ts

      - name: Extract Bluezone Statistics
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/extract_bluezone.ts

      - name: Sync Patch Notes
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/sync_patch_notes.ts

      - name: Check Storage After Maintenance
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: npx tsx scripts/monitor_storage.ts --label "AFTER"

      - name: Record Agent Monitor Snapshot
        if: ${{ always() && steps.database_health.outcome == 'success' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_AGENT_CRON_SECRET: ${{ secrets.ADMIN_AGENT_CRON_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SECRET="${ADMIN_AGENT_CRON_SECRET:-$CRON_SECRET}"
          if [ -z "$APP_URL" ] || [ -z "$SECRET" ]; then
            echo "APP_URL or agent cron secret is missing; skipping agent monitor snapshot."
            exit 0
          fi
          curl -fsS "$APP_URL/api/admin/agent/monitor" \
            -H "Authorization: Bearer $SECRET"

      - name: Record Agent Rollout Readiness Snapshot
        if: ${{ always() && steps.database_health.outcome == 'success' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_AGENT_CRON_SECRET: ${{ secrets.ADMIN_AGENT_CRON_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SECRET="${ADMIN_AGENT_CRON_SECRET:-$CRON_SECRET}"
          if [ -z "$APP_URL" ] || [ -z "$SECRET" ]; then
            echo "APP_URL or agent cron secret is missing; skipping agent rollout readiness snapshot."
            exit 0
          fi
          curl -fsS "$APP_URL/api/admin/agent/rollout" \
            -H "Authorization: Bearer $SECRET"

      - name: Cleanup PUBG Cache And Quota Tables
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/cleanup_pubg_cache.ts

      - name: Send Daily DB and R2 Report
        if: ${{ always() && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPER_SUCCEEDED: ${{ steps.smart_scraper.outputs.succeeded }}
          SCRAPER_SKIPPED: ${{ steps.smart_scraper.outputs.skipped }}
          SCRAPER_FAILED: ${{ steps.smart_scraper.outputs.failed }}
          MAINTENANCE_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx tsx scripts/send_daily_storage_report.ts

      # 벤치마커·블루존 수집이 먼저 PUBG API 예산을 사용한다.
      # 사용자 전적 자동 갱신은 다음 날 재시도해도 되므로 핫드랍 직전의 저우선 작업으로 둔다.
      - name: Run User Matches Sync
        id: sync_user_matches
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
        run: npx tsx scripts/sync_user_matches.ts --limit 15

      # User Matches Sync emits only aggregate fields. Keep the operational
      # summary useful while never copying a linked nickname or identity into
      # the Actions summary or a downstream job output.
      - name: Report Linked PUBG Sync Summary
        id: linked_sync_summary
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' && steps.sync_user_matches.outcome != 'skipped' }}
        env:
          SYNC_RATE_LIMITED: ${{ steps.sync_user_matches.outputs.rate_limited }}
          SYNC_CANDIDATE_COUNT: ${{ steps.sync_user_matches.outputs.candidate_count }}
          SYNC_SYNCED_IDENTITIES: ${{ steps.sync_user_matches.outputs.synced_identities }}
          SYNC_NEW_MATCHES: ${{ steps.sync_user_matches.outputs.new_matches }}
          SYNC_LOCK_COLLISIONS: ${{ steps.sync_user_matches.outputs.lock_collisions }}
          SYNC_STOPPED_REASON: ${{ steps.sync_user_matches.outputs.stopped_reason }}
          SYNC_SUMMARY: ${{ steps.sync_user_matches.outputs.sync_summary }}
        run: |
          safe_count() {
            case "${1:-}" in
              ''|*[!0-9]*) printf '0' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          candidate_count=$(safe_count "$SYNC_CANDIDATE_COUNT")
          synced_identities=$(safe_count "$SYNC_SYNCED_IDENTITIES")
          new_matches=$(safe_count "$SYNC_NEW_MATCHES")
          lock_collisions=$(safe_count "$SYNC_LOCK_COLLISIONS")
          rate_limit_tracking_errors=$(printf '%s' "${SYNC_SUMMARY:-}" \
            | jq -r 'if type == "object" and (.rateLimitTrackingErrors | type) == "number" then (.rateLimitTrackingErrors | floor) else 0 end' \
            2>/dev/null || printf '0')
          rate_limit_tracking_errors=$(safe_count "$rate_limit_tracking_errors")

          case "${SYNC_RATE_LIMITED:-false}" in
            true) rate_limited=true ;;
            *) rate_limited=false ;;
          esac
          case "${SYNC_STOPPED_REASON:-}" in
            rate_limited|quota_exhausted) stopped_reason="$SYNC_STOPPED_REASON" ;;
            *) stopped_reason="none" ;;
          esac

          {
            echo "## Linked PUBG Auto Sync"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Candidate count | ${candidate_count} |"
            echo "| Synced identities | ${synced_identities} |"
            echo "| New matches | ${new_matches} |"
            echo "| Lock collisions | ${lock_collisions} |"
            echo "| Rate limited | ${rate_limited} |"
            echo "| Stopped reason | ${stopped_reason} |"
            echo "| Rate-limit tracking errors | ${rate_limit_tracking_errors} |"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'rate_limit_tracking_errors=%s\n' "$rate_limit_tracking_errors" >> "$GITHUB_OUTPUT"

      - name: Skip Hotdrop After PUBG API Rate Limit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' && steps.sync_user_matches.outputs.rate_limited == 'true' }}
        run: echo "::warning title=PUBG API 한도 보호::User Matches Sync에서 429가 발생해 Hotdrop Collection을 건너뜁니다. 다음 실행에서 재시도합니다."

      - name: Run Hotdrop Collection
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database_health.outcome == 'success' && steps.sync_user_matches.outcome == 'success' && steps.sync_user_matches.outputs.rate_limited != 'true' }}
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/run_hotdrop.ts

  # 기존 수집이 끝난 뒤 별도 실행한다. 유지보수의 Hotdrop/스크래퍼 등
  # 독립적인 step 실패가 있어도 DB health gate가 통과했다면 백필은 반드시 시도한다.
  # 429는 스크립트가 rateLimited 결과를 남기고 정상 종료하므로, 다음 날 unknown 행만 이어서 처리한다.
  match-type-backfill:
    needs: [board-write-quota-cleanup, maintenance]
    if: ${{ always() && !cancelled() && needs.maintenance.outputs.database_health == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Backfill Unknown Match Types
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
        run: npx tsx scripts/backfill_unknown_match_types.ts --limit 300

  # 일일 작업 실패를 운영자가 알 수 있게 한다.
  # 기존에는 GitHub 기본 메일 외 알림이 없어 텔레메트리 정리·패치노트 동기화가
  # 며칠간 멈춰도 감지되지 않았다.
  # maintenance 잡의 steps 배열을 건드리지 않기 위해 별도 잡으로 분리했다.
  # (tests/hotdrop-boundary.test.ts 가 maintenance 의 마지막 step 을 검증한다.)
  failure-notify:
    runs-on: ubuntu-latest
    needs: [board-write-quota-cleanup, maintenance, match-type-backfill]
    if: ${{ failure() }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Notify Discord On Failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QUOTA_RESULT: ${{ needs.board-write-quota-cleanup.result }}
          MAINTENANCE_RESULT: ${{ needs.maintenance.result }}
          MATCH_TYPE_BACKFILL_RESULT: ${{ needs.match-type-backfill.result }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SYNC_CANDIDATE_COUNT: ${{ needs.maintenance.outputs.candidate_count }}
          SYNC_SYNCED_IDENTITIES: ${{ needs.maintenance.outputs.synced_identities }}
          SYNC_NEW_MATCHES: ${{ needs.maintenance.outputs.new_matches }}
          SYNC_LOCK_COLLISIONS: ${{ needs.maintenance.outputs.lock_collisions }}
          SYNC_STOPPED_REASON: ${{ needs.maintenance.outputs.stopped_reason }}
          SYNC_RATE_LIMIT_TRACKING_ERRORS: ${{ needs.maintenance.outputs.rate_limit_tracking_errors }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is missing; skipping failure notification."
            exit 0
          fi

          safe_count() {
            case "${1:-}" in
              ''|*[!0-9]*) printf '0' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          sync_candidate_count=$(safe_count "$SYNC_CANDIDATE_COUNT")
          sync_synced_identities=$(safe_count "$SYNC_SYNCED_IDENTITIES")
          sync_new_matches=$(safe_count "$SYNC_NEW_MATCHES")
          sync_lock_collisions=$(safe_count "$SYNC_LOCK_COLLISIONS")
          sync_rate_limit_tracking_errors=$(safe_count "$SYNC_RATE_LIMIT_TRACKING_ERRORS")
          case "${SYNC_STOPPED_REASON:-}" in
            rate_limited|quota_exhausted) sync_stopped_reason="$SYNC_STOPPED_REASON" ;;
            *) sync_stopped_reason="none" ;;
          esac

          status_label() {
            case "$1" in
              success) echo "✅ 정상" ;;
              failure|timed_out) echo "❌ 실패" ;;
              cancelled) echo "⏹ 취소" ;;
              skipped) echo "⏭ 건너뜀" ;;
              *) echo "❔ ${1:-확인 불가}" ;;
            esac
          }

          JOB_ROWS=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.name != "failure-notify" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | [.id, .name, .conclusion] | @tsv' \
            2>/tmp/bgms-jobs-error.log) || JOB_ROWS=""

          FAILED_STEPS=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --paginate \
            --jq '[.jobs[] | select(.name != "failure-notify") | .name as $job | .steps[]? | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | "\($job) / \(.name) (\(.conclusion))"] | .[0:8] | join("\n")' \
            2>/tmp/bgms-step-error.log) || FAILED_STEPS=""

          LOOKUP_NOTES=""
          if [ -z "$JOB_ROWS" ]; then
            FAILED_STEPS="(실패 잡 목록을 조회하지 못했습니다.)"
            LOOKUP_NOTES="실패 잡 목록 조회 실패: Actions 로그에서 직접 확인이 필요합니다."
          elif [ -z "$FAILED_STEPS" ]; then
            FAILED_STEPS=$(printf '%s\n' "$JOB_ROWS" | awk -F '\t' '{printf "%s (%s)\n", $2, $3}' | head -8)
          fi

          ERROR_LINES=""
          while IFS=$'\t' read -r JOB_ID JOB_NAME JOB_RESULT; do
            [ -z "$JOB_ID" ] && continue
            JOB_LOG="/tmp/bgms-job-${JOB_ID}.log"
            JOB_LOG_ERROR="/tmp/bgms-job-${JOB_ID}.error"
            if ! gh api "repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" >"$JOB_LOG" 2>"$JOB_LOG_ERROR"; then
              if [ -n "$LOOKUP_NOTES" ]; then LOOKUP_NOTES="${LOOKUP_NOTES}"$'\n'; fi
              LOOKUP_NOTES="${LOOKUP_NOTES}로그 조회 실패: ${JOB_NAME} (${JOB_RESULT})"
              continue
            fi
            MATCHED_LINES=$(grep -iE "Hotdrop 수집 실패|PUBG API error|HTTP [0-9]{3}|Error:|error-|failed|failure|429|rate limit|timeout|timed out" "$JOB_LOG" 2>/dev/null \
              | grep -vE "##\[error\]Process completed|DeprecationWarning|npm audit|npm warn|failure-notify|sync_summary=|candidate_count=|synced_identities=|new_matches=|lock_collisions=|stopped_reason=" \
              | grep -vEi "nickname|identity|player_id|player-name|account[_ -]?id" \
              | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' \
              | sed -E 's/\x1b\[[0-9;]*m//g' \
              | sed -E 's#https?://[^[:space:]]+#<URL 숨김>#g' \
              | sed -E 's/(Bearer[[:space:]]+)[^[:space:]]+/\1<토큰 숨김>/Ig' \
              | cut -c1-240 \
              | tail -n 8 || true)
            if [ -n "$MATCHED_LINES" ]; then
              if [ -n "$ERROR_LINES" ]; then ERROR_LINES="${ERROR_LINES}"$'\n'; fi
              ERROR_LINES="${ERROR_LINES}[${JOB_NAME}]"$'\n'"${MATCHED_LINES}"
            fi
          done <<< "$JOB_ROWS"

          if [ -z "$ERROR_LINES" ]; then
            ERROR_LINES="원인 미확인: 실패 잡 로그에서 분류 가능한 예외를 찾지 못했습니다."
          fi
          ERROR_LINES=$(printf '%s' "$ERROR_LINES" | cut -c1-1000)
          FAILED_STEPS=$(printf '%s' "$FAILED_STEPS" | cut -c1-700)

          MESSAGE=$(cat <<EOF
          🚨 **BGMS 새벽 자동 작업 실패**
          실행 시각: ${RUN_STARTED_AT}

          **무슨 일이 있었나요?**
          일일 유지보수 중 하나 이상의 작업이 완료되지 않았습니다.

          **작업별 상태**
          - 게시판 쓰기 제한 정리: $(status_label "$QUOTA_RESULT")
          - 데이터 유지보수: $(status_label "$MAINTENANCE_RESULT")
          - 전적 모드 백필: $(status_label "$MATCH_TYPE_BACKFILL_RESULT")

          **연동 PUBG 전적 동기화 (식별자 제외)**
          - 후보 수: ${sync_candidate_count}
          - 동기화한 identity 수: ${sync_synced_identities}
          - 신규 매치 수: ${sync_new_matches}
          - refresh lock 충돌 수: ${sync_lock_collisions}
          - 중단 사유: ${sync_stopped_reason}
          - rate-limit 기록 오류 수: ${sync_rate_limit_tracking_errors}

          **실패한 단계**
          ---
          ${FAILED_STEPS}
          ---

          **가능한 원인**
          ---
          ${ERROR_LINES}
          ---

          **운영자가 지금 할 일**
          1. 아래 실행 링크에서 실패 단계의 전체 로그를 확인합니다.
          2. [429]면 PUBG API 호출 간격/쿼터를 확인하고 다음 실행에서 재시도합니다.
          3. [Supabase] 또는 [timeout]이면 해당 서비스 상태와 유지보수 재실행 여부를 확인합니다.
          ${LOOKUP_NOTES:+4. ${LOOKUP_NOTES}}

          실행 로그: ${RUN_URL}
          EOF
          )
          # jq 로 JSON 을 만들어 개행·특수문자 이스케이프를 보장한다.
          jq -n --arg content "$MESSAGE" '{content: $content, allowed_mentions: {parse: ["everyone"]}}' \
            | curl -fsS -X POST "$DISCORD_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                --data @-
