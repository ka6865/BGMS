name: PUBG retention batch
description: DB 보존과 배치별 백업 다운로드 검증 뒤 만료 자료를 소량 정리한다.
inputs:
  batch:
    description: 이번 실행의 배치 번호 (1~10)
    required: true
outputs:
  continue:
    description: 성공한 배치 이후 예산 내에서 이어서 처리할 수 있는지
    value: ${{ steps.progress.outputs.continue }}
runs:
  using: composite
  steps:
    - name: Check batch start budget
      id: gate
      shell: bash --noprofile --norc -eo pipefail {0}
      env:
        OP_BATCH_INDEX: ${{ inputs.batch }}
      run: |
        [[ "$OP_BATCH_INDEX" =~ ^([1-9]|10)$ ]]
        npx tsx scripts/match_retention_batch_control.ts gate "$RUNNER_TEMP/match-retention/state.json"
        batch_directory="$RUNNER_TEMP/match-retention/batch-$OP_BATCH_INDEX"
        mkdir -p "$batch_directory"
        printf 'directory=%s\n' "$batch_directory" >> "$GITHUB_OUTPUT"
    - name: Inspect expired objects and prepare encrypted backup
      if: ${{ steps.gate.outputs.enabled == 'true' }}
      shell: bash --noprofile --norc -eo pipefail {0}
      env:
        OP_BATCH_DIRECTORY: ${{ steps.gate.outputs.directory }}
      run: |
        umask 077
        args=(--platform "$OP_PLATFORM" --limit "$OP_LIMIT" --scan-limit "$OP_SCAN_LIMIT" --manifest "$OP_BATCH_DIRECTORY/manifest.json")
        if [ -n "$OP_CUTOFF" ]; then args+=(--cutoff "$OP_CUTOFF"); fi
        if [ -n "$OP_ACCOUNT" ]; then args+=(--account-id "$OP_ACCOUNT"); fi
        if [ -n "$OP_MATCH" ]; then args+=(--match-id "$OP_MATCH"); fi
        if [ "$OP_MODE" = 'apply' ]; then
          args+=(--prepare-backup --preserve-performance --backup-artifact "$OP_BATCH_DIRECTORY/backup.enc")
        elif [ "$OP_MODE" != 'dry-run' ]; then
          exit 1
        fi
        npx tsx scripts/cleanup_expired_match_archives.ts "${args[@]}" | tee "$OP_BATCH_DIRECTORY/summary.json"
        cat "$OP_BATCH_DIRECTORY/summary.json" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload encrypted recovery artifact
      id: backup
      if: ${{ steps.gate.outputs.enabled == 'true' && env.OP_MODE == 'apply' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pubg-detail-retention-${{ github.run_id }}-${{ github.run_attempt }}-batch-${{ inputs.batch }}
        path: ${{ steps.gate.outputs.directory }}/backup.enc
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - name: Verify uploaded backup bytes before deletion
      if: ${{ steps.gate.outputs.enabled == 'true' && env.OP_MODE == 'apply' && steps.backup.outcome == 'success' }}
      shell: bash --noprofile --norc -eo pipefail {0}
      env:
        GH_TOKEN: ${{ github.token }}
        OP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
        OP_BATCH_DIRECTORY: ${{ steps.gate.outputs.directory }}
      run: |
        umask 077
        [ -n "$OP_ARTIFACT_ID" ]
        mkdir -p "$OP_BATCH_DIRECTORY/readback"
        # A successful upload can briefly return 404; retry only this readback.
        for attempt in 1 2 3; do
          if timeout 60s gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$OP_ARTIFACT_ID/zip" \
            > "$OP_BATCH_DIRECTORY/readback.zip" 2> "$OP_BATCH_DIRECTORY/readback.err"; then
            break
          else
            readback_status=$?
          fi
          retryable=false
          readback_error=$(< "$OP_BATCH_DIRECTORY/readback.err")
          if [[ "$readback_error" =~ HTTP[[:space:]]([0-9]{3}) ]]; then
            case "${BASH_REMATCH[1]}" in 404|429|5??) retryable=true ;; esac
          elif [ "$readback_status" -eq 124 ] || grep -Eqi \
            'timeout|timed out|EOF|connection (reset|refused|closed)|no such host|network is unreachable|temporary failure in name resolution' \
            "$OP_BATCH_DIRECTORY/readback.err"; then
            retryable=true
          fi
          if [ "$retryable" != true ] || [ "$attempt" -eq 3 ]; then
            printf 'Artifact readback failed; apply blocked.\n' >&2
            exit 1
          fi
          sleep "$attempt"
        done
        unzip -q "$OP_BATCH_DIRECTORY/readback.zip" -d "$OP_BATCH_DIRECTORY/readback"
        cmp "$OP_BATCH_DIRECTORY/backup.enc" "$OP_BATCH_DIRECTORY/readback/backup.enc"
    - name: Apply exact plan and verify object absence
      if: ${{ steps.gate.outputs.enabled == 'true' && env.OP_MODE == 'apply' && steps.backup.outcome == 'success' }}
      shell: bash --noprofile --norc -eo pipefail {0}
      env:
        OP_BATCH_DIRECTORY: ${{ steps.gate.outputs.directory }}
      run: |
        args=(--apply --backup-upload-verified --platform "$OP_PLATFORM" --limit "$OP_LIMIT" --scan-limit "$OP_SCAN_LIMIT" --manifest "$OP_BATCH_DIRECTORY/manifest.json" --backup-artifact "$OP_BATCH_DIRECTORY/backup.enc")
        if [ -n "$OP_CUTOFF" ]; then args+=(--cutoff "$OP_CUTOFF"); fi
        if [ -n "$OP_ACCOUNT" ]; then args+=(--account-id "$OP_ACCOUNT"); fi
        if [ -n "$OP_MATCH" ]; then args+=(--match-id "$OP_MATCH"); fi
        npx tsx scripts/cleanup_expired_match_archives.ts "${args[@]}" | tee "$OP_BATCH_DIRECTORY/result.json"
        cat "$OP_BATCH_DIRECTORY/result.json" >> "$GITHUB_STEP_SUMMARY"
    - name: Record progress and decide whether to continue
      id: progress
      if: ${{ steps.gate.outputs.enabled == 'true' }}
      shell: bash --noprofile --norc -eo pipefail {0}
      env:
        OP_BATCH_DIRECTORY: ${{ steps.gate.outputs.directory }}
      run: |
        result_path="$OP_BATCH_DIRECTORY/result.json"
        if [ "$OP_MODE" = 'dry-run' ]; then result_path="$OP_BATCH_DIRECTORY/summary.json"; fi
        npx tsx scripts/match_retention_batch_control.ts complete "$RUNNER_TEMP/match-retention/state.json" "$OP_BATCH_DIRECTORY/manifest.json" "$result_path"
